<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Youth For Christ International</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #fff7f4;
            color: #1d2430;
            text-align: center;
            padding: 2rem;
        }
        .nf-code {
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ef4723 0%, #ff6a3a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }
        h1 { font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 0.75rem 0 0.5rem; }
        p { color: #4f5f76; max-width: 26rem; margin: 0 auto 1.5rem; }
        .nf-btn {
            display: inline-block;
            padding: 0.85rem 1.9rem;
            border-radius: 999px;
            background: linear-gradient(135deg, #ef4723 0%, #ff6a3a 100%);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <p class="nf-code">404</p>
        <h1>This page could not be found</h1>
        <p>The page may have moved or the link may be out of date. Let's get you back to the Youth For Christ homepage.</p>
        <a class="nf-btn" href="/">Back to Home</a>
    </main>
</body>
</html>
